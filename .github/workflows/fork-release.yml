# The fork's bundles: Windows x64 zip, Linux x64 and arm64 tarballs, and the macOS arm64 DMG (signed, notarized, stapled), each built by
# packaging/build_bundle.py and smoke-tested frozen from a read-only place by packaging/smoke_bundle.py. A v*-ns.* tag also drafts a GitHub Release
# the developer publishes by hand; upstream's v0.1.x tags never match (D-10). Signing secrets exist only in the 'release' environment (tags v*-ns.*
# and branch main) and reach the macos job's scripts through env: only. No pull-request trigger. Every action pinned to a commit SHA.
name: fork-release

on:
  push:
    tags: ['v*-ns.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:   # a notarization in flight must finish, and two drafts for one tag must not race
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: windows-x64 }
          - { os: ubuntu-22.04, target: linux-x64, floor: '2.34' }        # PKG-03 names glibc 2.34
          - { os: ubuntu-24.04-arm, target: linux-arm64, floor: '2.39' }  # the arm64 PySide6 wheel alone needs GLIBC_2.38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # build_bundle.py's version comes from git describe
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Qt libraries PyInstaller collects and the smoke needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3
      - name: Install the hashed locks
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Build the PyInstaller bootloader on this host
        if: runner.os == 'Windows'
        run: python packaging/build_bootloader.py
      - name: Build the bundle
        run: python packaging/build_bundle.py
      - name: Smoke-test the frozen bundle from a read-only copy
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/smoke_bundle.py dist/nx2android
      - name: glibc floor
        if: runner.os == 'Linux'
        env:
          FLOOR: ${{ matrix.floor }}
        run: python packaging/glibc_floor.py dist/nx2android "$FLOOR" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Asset name
        id: asset
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -- dist/nx2android-*-"$TARGET".*
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "[RED] expected one dist/nx2android-*-$TARGET.* file, found: $*"; exit 1; }
          echo "name=${1#dist/}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.asset.outputs.name }}
          path: dist/${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 7

  macos:
    name: build (macos-arm64, signed and notarized)
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the hashed locks
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-build.txt
      - name: Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/nx2a-signing.keychain-db"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Build and sign the bundle (hardened runtime, timestamp)
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: python packaging/build_bundle.py
      - name: Notarize the DMG
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          dmg=$(echo dist/nx2android-*-macos-arm64.dmg); [ -f "$dmg" ] || { echo "[RED] no DMG in dist/"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p8"
          auth=(--key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          out=$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json) || true
          echo "$out"
          id=$(printf '%s' "$out" | python -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))' || true)
          status=$(printf '%s' "$out" | python -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))' || true)
          if [ -n "$id" ]; then xcrun notarytool log "$id" "${auth[@]}" || true; fi
          rm -f "$RUNNER_TEMP/key.p8"
          [ "$status" = Accepted ] || { echo "[RED] notarization status: ${status:-none}"; exit 1; }
      - name: Staple and check as Gatekeeper will
        run: |
          dmg=$(echo dist/nx2android-*-macos-arm64.dmg)
          # stapler fetches the ticket from CloudKit; run 40937559241 lost that link (-1005, error 68) right after an Accepted notarization
          for n in 1 2 3 4; do
            xcrun stapler staple "$dmg" && break
            [ "$n" -lt 4 ] || { echo "[RED] stapler staple failed 4 times"; exit 1; }
            echo "stapler staple failed, retry $n"; sleep $((n * 20))
          done
          xcrun stapler validate "$dmg"
          spctl -a -t open --context context:primary-signature -v "$dmg"
      - name: Smoke-test from the read-only mount (re-verifies codesign afterwards)
        id: asset
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dmg=$(echo dist/nx2android-*-macos-arm64.dmg)
          python packaging/smoke_bundle.py "$dmg"
          echo "name=${dmg#dist/}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.asset.outputs.name }}
          path: dist/${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 7
      - name: Delete the temporary keychain and key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nx2a-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/key.p8"

  upstream-diff:   # CI-04: a report, not a gate; the developer reviews it at upstream merges
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: nxnative/ against upstream main since the merge base
        run: |
          git fetch --no-tags https://github.com/shirai91/nx2android.git main
          { echo '## nxnative/ against shirai91/nx2android main (since the merge base)'; echo '```'
            git diff --stat FETCH_HEAD...HEAD -- nxnative/; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [build, macos, upstream-diff]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Exactly the four bundles
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          v=${TAG#v}; n=0
          for a in windows-x64.zip macos-arm64.dmg linux-x64.tar.gz linux-arm64.tar.gz; do
            if [ -f "dist/nx2android-$v-$a" ]; then n=$((n + 1)); else echo "[RED] missing nx2android-$v-$a"; fi
          done
          [ "$n" -eq 4 ] && [ "$(ls dist | wc -l)" -eq 4 ] || { echo "[RED] a draft needs exactly the four bundles"; exit 1; }
      - name: Draft the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --draft --title "nx2android $TAG" --notes "Built by fork-release.yml; see packaging/INSTALL.md."
