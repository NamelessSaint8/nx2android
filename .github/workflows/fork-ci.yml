# The fork's test matrix: the whole suite, headless, on the four host types plus the Python 3.11 floor, on every push and pull request.
# Read-only token and no secrets; every action pinned to a commit SHA; checkout keeps no credentials. Values reach run scripts through env:.
# Uploads no bundles: testers get those from fork-release.yml.
name: fork-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, python: '3.14' }
          - { os: macos-15, python: '3.14' }
          - { os: ubuntu-22.04, python: '3.14' }
          - { os: ubuntu-24.04-arm, python: '3.14' }
          - { os: ubuntu-22.04, python: '3.11' }   # the CLI floor (the GUI tests skip there); setup-python's newest 3.11 carries the CVE-2025-4517 tarfile fix
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (needed even offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libglib2.0-0 libdbus-1-3
      - name: Install the hashed lock
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Tests
        run: python -m unittest discover -v tests 2>&1 | tee unittest.log
      - name: Some tests ran
        run: grep -Eq '^Ran [1-9][0-9]* tests?' unittest.log
